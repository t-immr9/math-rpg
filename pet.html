<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe9ef">
<title>すうがくペット</title>
<style>
/* 育成ゲームの見た目。問題の入力画面(#quiz の中)は engine.js が作る。数式・入力まわりの CSS は index.html と同じ名前なので、
   エンジンの入力画面を変えたら、ここの「入力画面」の部分も 合わせて直す。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f6e6ee;color:#5a4a58;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;font-weight:bold}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;width:min(100vw,58vh);height:100vh;margin:0 auto;display:flex;flex-direction:column;background:#fff8f2;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
@supports(height:100dvh){#app{width:min(100vw,58dvh);height:100dvh}}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:#ffd94a;border:2px solid #e0a820;vertical-align:-.12em;margin-right:.25em}
#ptop{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#ffe9ef;border-bottom:2px solid #f6cfdc;font-size:14px}
#pname{flex:1;min-width:0;text-align:left;background:#fff;border:2px solid #f6cfdc;border-radius:999px;padding:4px 12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pname small{font-size:11px;color:#b08aa0;margin-left:8px}
#psnd{background:#fff;border:2px solid #f6cfdc;border-radius:999px;padding:4px 8px;font-size:12px;min-height:30px}
#proom{flex:none;position:relative;line-height:0;overflow:hidden;border-bottom:2px solid #f6cfdc}
#proomsvg svg{width:100%;height:auto;display:block}
#ppets{position:absolute;inset:0;pointer-events:none}
.pw{position:absolute;bottom:9%;width:27%;margin-left:-13.5%;transition:left 2.6s ease-in-out;pointer-events:auto;cursor:pointer}
.pw.main{width:42%;margin-left:-21%;bottom:2%}
.pw svg{width:100%;height:auto;display:block;overflow:visible}
.pin{position:relative;transform-origin:50% 92%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.pw.walk .pin{animation:waddle .52s ease-in-out infinite}
@keyframes waddle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3%)}}
.pw.hop .pin{animation:hop .6s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-16%) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.pw.wob .pin{animation:wob .7s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.hearts{position:absolute;left:50%;top:0;font-size:22px;color:#f47a9a;line-height:1;animation:rise 1.2s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,10px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-26px) scale(1.2);opacity:0}}
.pet .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%,100%{opacity:.25}50%{opacity:1}}
.pet .aura{animation:aura 2.6s ease-in-out infinite;transform-origin:60px 66px}
@keyframes aura{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.04);opacity:1}}
.pet .tw{animation:zz 1.8s ease-in-out infinite}
.pet .tw:nth-of-type(2n){animation-delay:.6s}.pet .tw:nth-of-type(3n){animation-delay:1.1s}
#app.editing .pw{opacity:.4}
#pbubble{position:absolute;left:8px;right:8px;top:8px;background:#fff;border:2px solid #f6cfdc;border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.5;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
#pbubble.on{opacity:.97;transform:none}
#pinfo{flex:1;min-height:0;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.grow,.meal{background:#fff;border:2px solid #f6cfdc;border-radius:16px;padding:10px 12px;font-size:14px}
.grow span,.meal span{display:inline-block;margin-right:8px}
.grow small,.meal small{display:block;font-size:12px;color:#a08a9a;margin-top:6px;font-weight:normal}
.bar{height:12px;border-radius:999px;background:#f6e6ee;overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb7c5,#ffd94a);transition:width .5s}
.food{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px dashed #e4c8d4;margin:0 3px;vertical-align:middle}
.food.on{border:2px solid #d89a50;background:radial-gradient(circle at 35% 35%,#ffe9b0,#f4b860)}
#pnav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:#ffe9ef;border-top:2px solid #f6cfdc}
#pnav button{background:#fff;border:2px solid #f6cfdc;border-radius:14px;min-height:56px;font-size:12px;padding:4px 0;line-height:1.3}
#pnav button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
#pnav button:active{background:#ffe0ea}
#pnav button.call{border-color:#f47a9a;background:#fff0f4;animation:call 1.6s ease-in-out infinite}
@keyframes call{0%,100%{transform:none}50%{transform:translateY(-3px)}}
#app.quiz #ptop,#app.quiz #proom,#app.quiz #pinfo,#app.quiz #pnav,#app.quiz #pedit{display:none}
#pedit{flex:1;min-height:0;padding:8px 10px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;width:64px;height:64px;background:#fff;border:2px solid #f6cfdc;border-radius:12px;padding:4px}
.chips button.off{opacity:.5}.chips button.sel{border-color:#f47a9a;background:#fff0f4}
.chips svg{width:100%;height:100%}
#ptoast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(90,74,88,.92);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;white-space:nowrap;z-index:40}
#ptoast.on{animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}
/* シート */
#psheet{display:none;position:absolute;inset:0;z-index:20;background:rgba(90,74,88,.35)}
#psheet.on{display:block}
.sh{position:absolute;inset:0;background:#fff8f2;display:flex;flex-direction:column}
.shh{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#ffe9ef;border-bottom:2px solid #f6cfdc;font-size:17px}
.shh button{background:#fff;border:2px solid #f6cfdc;border-radius:999px;padding:6px 14px;font-size:14px;min-height:40px}
.shb{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 24px;-webkit-overflow-scrolling:touch}
.lab{font-size:13px;color:#b08aa0;margin:14px 0 6px}
.note{font-size:12.5px;color:#8a7a88;line-height:1.7;font-weight:normal;margin:8px 0}
.err{color:#e0605a;font-size:13px;min-height:1.4em;margin-top:4px}
.col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;align-items:stretch;margin-top:6px}.row>*{flex:1}
.big,.row button,.seg button,.opts2 button,.units button,.tlist button,.calh button{background:#fff;border:2px solid #f0bccd;border-radius:14px;min-height:48px;font-size:15px;padding:8px 10px}
.big{display:block;width:100%;background:#ff9db5;border-color:#f47a9a;color:#fff;font-size:16px;text-align:center;text-decoration:none;box-shadow:0 3px 0 #e8809a}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 #e8809a}
.row .big{background:#ff9db5;border-color:#f47a9a;color:#fff}
.big.danger{background:#fff;color:#d24a4a;border-color:#e88;box-shadow:0 3px 0 #f0caca}
.big.sub.danger{margin-top:14px}
.big.sub,.big.link{background:#fff;color:#5a4a58;box-shadow:0 3px 0 #f0d4dd}
.big.gold{background:#ffd94a;border-color:#e0a820;color:#6a4a10;box-shadow:0 3px 0 #d8a020}
button:disabled{opacity:.4}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:6px 2px;font-size:14px}
.seg .sel,.opts2 .sel,.units .sel,.tlist .sel,.card button.sel{background:#fff0f4;border-color:#f47a9a;color:#d8507a}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 button{min-height:42px;padding:4px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.opts2 i{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #6b5a66}
.pvs{display:flex;justify-content:center;gap:14px;margin:10px 0;text-align:center}
.pvs small{font-size:11px;color:#a08a9a;font-weight:normal}
.pv{width:124px;height:124px;background:radial-gradient(circle at 50% 60%,#fff,#ffeef3);border:2px solid #f6cfdc;border-radius:20px;line-height:0}
.pv svg,.bigpet svg{width:100%;height:100%}
.bigpet{width:170px;height:170px;margin:0 auto;line-height:0}
input,textarea{width:100%;background:#fff;border:2px solid #f0bccd;border-radius:14px;padding:10px;font-size:18px;user-select:text;-webkit-user-select:text}
.units{display:flex;flex-direction:column;gap:6px}
.units button{display:flex;align-items:center;gap:10px;text-align:left;line-height:1.4;font-size:14px}
.units b{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #f0bccd;display:flex;align-items:center;justify-content:center;color:#f47a9a;background:#fff}
.units small{display:block;font-size:11px;color:#a08a9a;font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid.g5{grid-template-columns:repeat(5,1fr);gap:4px}
.card{background:#fff;border:2px solid #f6e0e8;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.3}
.card svg{width:100%;height:auto;max-height:84px}
.card.own{border-color:#f6cfdc}.card.ltd{background:#fffbe6}
.card button{width:100%;background:#fff;border:2px solid #f0bccd;border-radius:10px;min-height:36px;font-size:13px;padding:2px}
.card button.dim{opacity:.55}
.card small{font-size:10.5px;color:#a08a9a;font-weight:normal}.card .lim{color:#c08a20}
.card.yet svg{filter:brightness(0);opacity:.13}
.coinline{font-size:18px;text-align:center;margin-bottom:8px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tlist button{font-size:13px;min-height:52px;padding:4px;line-height:1.3}
.tlist small{display:block;font-size:10.5px;color:#a08a9a;font-weight:normal}
.tlist .yet{opacity:.6}
.calh{display:flex;align-items:center;justify-content:space-between;font-size:17px}
.calh button{min-height:40px;padding:4px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.cal u{text-decoration:none;font-size:11px;color:#b08aa0}
.cal i{position:relative;font-style:normal;font-size:12px;aspect-ratio:1;border-radius:10px;background:#fff;border:2px solid #f6e6ee;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 4px;color:#a08a9a}
.cal i:empty{background:none;border:none}
.cal i.today{border-color:#f47a9a}
.cal i b,.stampbig i{position:absolute;left:50%;top:56%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-12deg);border-radius:50%;border:3px solid #f47a9a;background:radial-gradient(circle,#ffd3de 0 34%,transparent 36%),conic-gradient(#ffb7c5 0 12%,transparent 0 20%,#ffb7c5 0 32%,transparent 0 40%,#ffb7c5 0 52%,transparent 0 60%,#ffb7c5 0 72%,transparent 0 80%,#ffb7c5 0 92%,transparent 0);opacity:.9}
.stampbig{position:relative;width:110px;height:110px;margin:0 auto}
.stampbig i{width:86%;top:50%;animation:stamp .5s ease-out}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.9}}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center;font-size:12px}
.stat3 div{background:#fff;border:2px solid #f6e0e8;border-radius:12px;padding:8px 2px}
.stat3 b{font-size:22px;color:#f47a9a;margin-right:2px}.stat3 small{display:block;font-size:11px;color:#a08a9a;font-weight:normal}
.urow{background:#fff;border:2px solid #f6e0e8;border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px;line-height:1.5}
.urow small{font-size:11.5px;color:#a08a9a;font-weight:normal}
.pw{}
.sh .pw{position:static;width:auto;margin:10px 0;background:#fff;border:2px solid #f0bccd;border-radius:14px;padding:10px;font-size:19px;line-height:1.9;letter-spacing:.06em;text-align:center;transition:none;cursor:auto;user-select:text;-webkit-user-select:text}
.photo{background:linear-gradient(160deg,#ffe9ef,#e9f3ff 55%,#fff6d8);border:3px solid #fff;border-radius:24px;box-shadow:0 4px 14px rgba(180,130,150,.35);padding:16px 14px;text-align:center}
.phbg{width:210px;height:210px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#fff 40%,rgba(255,255,255,0) 72%);line-height:0}
.phbg svg{width:100%;height:100%}
.phn{font-size:28px;margin-top:4px}.phs{font-size:14px;color:#8a7a88;margin-top:2px}.pht{font-size:15px;color:#d8507a;margin-top:6px}
.phf{font-size:11px;color:#a08a9a;margin-top:12px;font-weight:normal}
.welcome{text-align:center}.welcome h2{font-size:20px;margin:6px 0;color:#d8507a}.welcome p{font-size:13.5px;line-height:1.9;font-weight:normal}
.welcome .pv{width:92px;height:92px}
/* お知らせ・進化 */
#pfx{display:none;position:absolute;inset:0;z-index:30;background:rgba(90,74,88,.5);align-items:center;justify-content:center;padding:20px}
#pfx.on{display:flex}
.pop{width:100%;background:#fff8f2;border:3px solid #fff;border-radius:24px;padding:18px 16px;text-align:center;animation:popin .3s ease-out;box-shadow:0 6px 20px rgba(90,60,80,.3)}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.pop h3{font-size:21px;margin:8px 0 4px;color:#d8507a}.pop p{font-size:14px;line-height:1.8;margin:6px 0 12px}.pop small{font-size:12px;color:#8a7a88;font-weight:normal}
.pop .ttl{font-size:20px;color:#c08a20}
.gift{width:110px;height:110px;margin:6px auto;line-height:0}.gift svg{width:100%;height:100%}
.evo{position:relative;width:200px;height:200px;margin:0 auto;line-height:0}
.evo svg{position:absolute;inset:0;width:100%;height:100%}
.evo .rays{position:absolute;inset:-10%;border-radius:50%;background:repeating-conic-gradient(rgba(255,217,74,.5) 0 8deg,transparent 0 20deg);animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.evoa{position:absolute;inset:0;animation:evoa 1.6s ease-in forwards}
.evob{position:absolute;inset:0;animation:evob 1.6s ease-out forwards}
@keyframes evoa{0%{opacity:1;filter:none}60%{opacity:1;filter:brightness(3) saturate(0)}100%{opacity:0;filter:brightness(3) saturate(0)}}
@keyframes evob{0%,55%{opacity:0;transform:scale(.6);filter:brightness(3)}75%{opacity:1;transform:scale(1.12);filter:brightness(1.6)}100%{opacity:1;transform:none;filter:none}}
/* 問題を解く画面: 上に キャラクター、下に 黒板(エンジンの入力画面)*/
#pquiz{display:none;flex:1;min-height:0;flex-direction:column}
#app.quiz #pquiz{display:flex}
#pqhead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#ffe9ef;border-bottom:2px solid #f6cfdc}
#pqpet{flex:none;width:76px;height:76px;line-height:0}
#pqpet svg{width:100%;height:100%}
#pqpet.munch{animation:munch 1s ease-in-out}
@keyframes munch{0%,100%{transform:none}20%,60%{transform:scale(1.08,.92)}40%,80%{transform:scale(.95,1.06)}}
#pqside{flex:1;min-width:0}
#pqprog{font-size:12px;display:flex;align-items:center;flex-wrap:wrap}
#pqprog span{margin-right:6px}#pqprog em{font-style:normal;margin-left:auto}
#pqprog .food{width:16px;height:16px;margin:0 2px}
#pqsay{margin-top:4px;background:#fff;border:2px solid #f6cfdc;border-radius:12px;padding:5px 9px;font-size:12.5px;line-height:1.55;min-height:2.6em;max-height:5.4em;overflow-y:auto}
#quiz{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#fff8f2;color:#fcfcfc}
#hud,#stage,#pad,#ov,#choices{display:none !important}
/* --- 入力画面(index.html と そろえる)--- */
#panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px;overflow:hidden}
.win{border:5px solid #c9a27a;border-radius:12px;background:#24443c;box-shadow:inset 0 0 0 2px #1a332d}
#msg{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;font-size:16px;line-height:1.7;position:relative}
#msg .more{display:none;position:sticky;float:right;bottom:0;animation:blink .8s steps(2) infinite}
#msg.done .more{display:block}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
#keys{display:none;flex:none;grid-template-columns:repeat(4,1fr);gap:5px;padding:2px 6px 8px}
#keys.on{display:grid}
.k{height:42px;border:2px solid #f0bccd;border-radius:12px;background:#fff;color:#5a4a58;font-size:20px;touch-action:none;display:flex;align-items:center;justify-content:center;font-weight:bold}
.k:active{background:#ffd3de}
.k.x{background:#efe6ff;border-color:#c4a4ea}.k.f{font-size:13px;background:#fff6e6;border-color:#ecd0a8}
.k.ok{grid-column:span 2;background:#ff9db5;border-color:#f47a9a;color:#fff;font-size:17px}
.k .mf{font-size:11px;line-height:1}
.k.wide{grid-column:span 4}.k.tall{height:48px}
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.mn{border-bottom:2px solid currentColor;padding:0 .25em .05em}.md{padding:.05em .25em 0}
.mr{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em}
.ms{width:.62em;height:auto;flex:none;fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke;overflow:visible}
.ms path{vector-effect:non-scaling-stroke}
.mb{border-top:2px solid currentColor;padding:.08em .15em 0 .1em;line-height:1.25}
.mi{font-size:.6em;align-self:flex-start;margin-right:-.35em;line-height:1}
.mbar{text-decoration:overline;text-decoration-thickness:.09em;text-underline-offset:0}
sup{font-size:.68em;vertical-align:.65em;line-height:1}sub{font-size:.68em;vertical-align:-.35em;line-height:1}
sup .mf,sub .mf{font-size:1.15em}
sup:has(.mf){vertical-align:.9em}
.qt{font-size:15px;line-height:1.9}.qe{font-size:22px;text-align:center;padding:6px 0;line-height:2;white-space:pre-line}
.qf{font-size:22px;text-align:center;padding:6px 0 2px;line-height:2.2}
.qh{font-size:14px;color:#ffe27a;line-height:2;border-top:1px dashed #6f9488;margin-top:4px}
.qn{font-size:13px;color:#ffb07a;min-height:1.2em;line-height:1.4}
.blank{display:inline-block;min-width:1.8em;min-height:1.7em;border:2px dashed #cfe0d8;border-radius:6px;margin:0 .15em;padding:0 .2em;vertical-align:middle;text-align:center;line-height:1.6}
.blank.act{border:2px solid #ffe27a;background:#3a5a2c}
.blank .bp{min-width:1.3em;min-height:1.25em;display:block}
.blank .bp.cur{background:#5c7a30}
.blank.act:not(:has(.bp))::after,.bp.cur::after{content:"";display:inline-block;width:2px;height:1em;background:#ffe27a;vertical-align:-.1em;animation:blink .8s steps(2) infinite}
.qfig{text-align:center;line-height:0;margin:2px 0;cursor:zoom-in}
.qfig svg{width:100%;max-width:300px;height:auto;max-height:28vh}
.qz{font-size:11px;color:#a8c4ba;line-height:1.5}
/* 入力画面: 答えの部分(.qans)は 黒板の下に固定。問題文と図(.qtop)は 残りの高さに 収め、はみ出すと ここだけ スクロール(index.html と そろえる) */
#msg.asking{overflow:hidden;display:flex;flex-direction:column;padding-bottom:4px}
#msg.asking .q{flex:1;min-height:0;display:flex;flex-direction:column}
#msg.asking .qtop{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}

.ex{font-size:15px}

<script>
/* コース一覧。コースを追加したら、ここに1行足す(RPG の index.html と 同じコースを 使う)。 */
var COURSES = [
  { id: 'suu1-2gakki-kimatsu', title: '数学I 2学期期末', sub: '2次方程式・2次不等式・データの分析' },
  { id: 'suu2-2gakki-kimatsu', title: '数学II 2学期期末', sub: '加法定理 〜 指数関数・対数関数' },
  { id: 'suuA-2gakki-kimatsu', title: '数学A 2学期期末', sub: '接弦定理・方べきの定理・2つの円・作図・空間図形・多面体' }
];
(function () {
  var app = document.getElementById('app');
  var id = new URLSearchParams(location.search).get('course');
  if (!id || !/^[A-Za-z0-9_-]+$/.test(id)) {
    app.innerHTML = '<div class="courses"><h1>すうがくペット</h1><p>毎日 3分、いっしょに 育とう。コースを えらんでね。</p>' +
      COURSES.map(function (c) { return '<a href="?course=' + c.id + '">' + c.title + '<small>' + c.sub + '</small></a>'; }).join('') + '</div>';
    return;
  }
  var s = document.createElement('script');
  s.src = 'courses/' + id + '.js';
  s.onload = function () { MathPet.start(id, app); };
  s.onerror = function () { app.innerHTML = '<div class="courses">コース「' + id + '」が 見つかりません。<a href="pet.html">コース一覧へ</a></div>'; };
  document.body.appendChild(s);
})();
</script>
